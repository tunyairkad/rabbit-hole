<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji Memory</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      padding: 1.5rem;
      color: #2d3748;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
    }

    .stats {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      margin-bottom: 1.25rem;
      background: rgba(255, 255, 255, 0.95);
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    }

    .stat {
      font-size: 0.9rem;
      font-weight: 600;
      color: #4a5568;
    }

    .stat span {
      color: #667eea;
      font-size: 1.25rem;
      font-weight: 800;
    }

    button.reset {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    button.reset:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(102, 126, 234, 0.5);
    }

    button.reset:active {
      transform: translateY(0);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      max-width: 420px;
      width: 100%;
      perspective: 1000px;
    }

    .card {
      aspect-ratio: 1;
      cursor: pointer;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card.matched {
      cursor: default;
      pointer-events: none;
    }

    .card.matched .card-face {
      box-shadow: 0 0 0 3px #48bb78, 0 8px 24px rgba(72, 187, 120, 0.35);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }

    .card-back {
      background: linear-gradient(145deg, #fff 0%, #e8ecf4 100%);
      border: 3px solid rgba(255, 255, 255, 0.8);
    }

    .card-back::after {
      content: "?";
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .card-front {
      background: #fff;
      transform: rotateY(180deg);
      font-size: clamp(2rem, 8vw, 3rem);
      border: 3px solid #fff;
    }

    .card:not(.flipped):not(.matched):hover .card-back {
      transform: scale(1.02);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
    }

    .card.shake .card-front {
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      25% { transform: rotateY(180deg) translateX(-6px); }
      75% { transform: rotateY(180deg) translateX(6px); }
    }

    .win-overlay {
      position: fixed;
      inset: 0;
      background: rgba(45, 55, 72, 0.6);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s, visibility 0.35s;
      z-index: 10;
    }

    .win-overlay.visible {
      opacity: 1;
      visibility: visible;
    }

    .win-card {
      background: #fff;
      padding: 2.5rem 3rem;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.25);
      transform: scale(0.85);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .win-overlay.visible .win-card {
      transform: scale(1);
    }

    .win-card h2 {
      font-size: 2rem;
      background: linear-gradient(135deg, #667eea, #f093fb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .win-card p {
      color: #718096;
      margin-bottom: 1.25rem;
    }

    .win-emoji {
      font-size: 3rem;
      margin-bottom: 1rem;
      animation: bounce 0.6s ease infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }
  </style>
</head>
<body>
  <h1>Emoji Memory</h1>
  <p class="subtitle">Find all 8 matching pairs</p>

  <div class="stats">
    <div class="stat">Moves: <span id="moves">0</span></div>
    <button class="reset" type="button" id="reset">New game</button>
  </div>

  <div class="board" id="board" aria-label="Memory card grid"></div>

  <div class="win-overlay" id="winOverlay" role="dialog" aria-labelledby="winTitle" aria-hidden="true">
    <div class="win-card">
      <div class="win-emoji" aria-hidden="true">🎉</div>
      <h2 id="winTitle">You won!</h2>
      <p id="winMessage">Great memory!</p>
      <button class="reset" type="button" id="playAgain">Play again</button>
    </div>
  </div>

  <script>
    const EMOJIS = ["🐶", "🐱", "🦊", "🐼", "🐸", "🦋", "🌮", "🚀"];
    const PAIR_COUNT = EMOJIS.length;

    let cards = [];
    let flipped = [];
    let matchedCount = 0;
    let moves = 0;
    let lock = false;
    let winTimerId = null;

    const boardEl = document.getElementById("board");
    const movesEl = document.getElementById("moves");
    const winOverlay = document.getElementById("winOverlay");
    const winMessage = document.getElementById("winMessage");

    function shuffle(array) {
      const a = [...array];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildDeck() {
      return shuffle([...EMOJIS, ...EMOJIS]);
    }

    function createCard(emoji, index) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "card";
      card.dataset.index = index;
      card.dataset.emoji = emoji;
      card.setAttribute("aria-label", "Face down card");

      card.innerHTML = `
        <span class="card-face card-back" aria-hidden="true"></span>
        <span class="card-face card-front" aria-hidden="true">${emoji}</span>
      `;

      card.addEventListener("click", () => onCardClick(card));
      return card;
    }

    function initGame() {
      clearTimeout(winTimerId);
      winTimerId = null;
      boardEl.innerHTML = "";
      flipped = [];
      matchedCount = 0;
      moves = 0;
      lock = false;
      movesEl.textContent = "0";
      winOverlay.classList.remove("visible");
      winOverlay.setAttribute("aria-hidden", "true");

      const deck = buildDeck();
      cards = deck.map((emoji, i) => {
        const card = createCard(emoji, i);
        boardEl.appendChild(card);
        return card;
      });
    }

    function onCardClick(card) {
      if (
        lock ||
        card.classList.contains("flipped") ||
        card.classList.contains("matched")
      ) {
        return;
      }

      flipCard(card, true);
      flipped.push(card);

      if (flipped.length < 2) return;

      lock = true;
      moves++;
      movesEl.textContent = moves;

      const [first, second] = flipped;
      const match = first.dataset.emoji === second.dataset.emoji;

      if (match) {
        first.classList.add("matched");
        second.classList.add("matched");
        first.setAttribute("aria-label", `Matched ${first.dataset.emoji}`);
        second.setAttribute("aria-label", `Matched ${second.dataset.emoji}`);
        matchedCount++;
        flipped = [];
        lock = false;

        if (matchedCount === PAIR_COUNT) {
          winTimerId = setTimeout(showWin, 400);
        }
      } else {
        first.classList.add("shake");
        second.classList.add("shake");
        setTimeout(() => {
          flipCard(first, false);
          flipCard(second, false);
          first.classList.remove("shake");
          second.classList.remove("shake");
          flipped = [];
          lock = false;
        }, 800);
      }
    }

    function flipCard(card, faceUp) {
      card.classList.toggle("flipped", faceUp);
      card.setAttribute(
        "aria-label",
        faceUp ? `Revealed ${card.dataset.emoji}` : "Face down card"
      );
    }

    function showWin() {
      winMessage.textContent = `You found all pairs in ${moves} moves!`;
      winOverlay.classList.add("visible");
      winOverlay.setAttribute("aria-hidden", "false");
    }

    document.getElementById("reset").addEventListener("click", initGame);
    document.getElementById("playAgain").addEventListener("click", initGame);

    initGame();
  </script>
</body>
</html>
